name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, типы, данные, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история нужна для lastmod в sitemap.xml (дата коммита страницы).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Проверка data/*.json
        run: npm run check:data
      - name: Офферы (erid, рекламодатель, домены, стоп-слова, сроки)
        run: npm run check:offers
      - run: npm run lint
      - name: Конфиги выпуска (Nginx, systemd, скрипты)
        run: npm run check:deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Внешние ссылки только из allowlist
        run: npm run check:links
      - name: 'SEO: sitemap, title, description, canonical, микроразметка'
        run: npm run check:seo
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: output
          path: .output
          include-hidden-files: true
          retention-days: 3

  e2e:
    name: e2e (Playwright + axe)
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: output
          path: .output
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (телефон)
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: output
          path: .output
      - run: npm run lhci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
