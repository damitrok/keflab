# Запросы на неизвестный Host не обслуживаем: без ответа, без логов.
# Нужен самоподписанный сертификат-заглушка (README, шаг 6): он только чтобы 443 отвечал на handshake.
# Копировать в /etc/nginx/sites-available/default-reject; стандартный default-сайт удалить.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/keflab/default.crt;
    ssl_certificate_key /etc/nginx/keflab/default.key;
    access_log off;
    location / {
        return 444;
    }
}
