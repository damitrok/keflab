# staging.keflab.ru — тестовый стенд: basic auth, noindex, robots закрыт.
# Раскладка как у продакшна: /srv/keflab-staging/current, Node 127.0.0.1:3001.
# Пароль basic auth: /etc/nginx/keflab-staging.htpasswd — не в репозитории, см. README.
# ВНИМАНИЕ: nginx локально не проверялся. Перед включением: sudo nginx -t.

# --- HTTP: ACME и перенаправление на HTTPS (без auth: certbot должен достучаться) ---
server {
    listen 80;
    listen [::]:80;
    server_name staging.keflab.ru;
    access_log /var/log/nginx/keflab-staging.access.log keflab_main;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://staging.keflab.ru$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.keflab.ru;

    ssl_certificate     /etc/letsencrypt/live/staging.keflab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.keflab.ru/privkey.pem;
    include /etc/nginx/keflab/snippets/ssl.conf;

    include /etc/nginx/keflab/csp/staging.conf;

    root /srv/keflab-staging/current/.output/public;
    client_max_body_size 16k;

    auth_basic "keflab staging";
    auth_basic_user_file /etc/nginx/keflab-staging.htpasswd;

    access_log /var/log/nginx/keflab-staging.access.log keflab_main;
    error_log /var/log/nginx/keflab-staging.error.log warn;

    include /etc/nginx/keflab/snippets/compression.conf;

    # robots.txt закрывает всё. Без auth: поисковик должен его получить.
    location = /robots.txt {
        auth_basic off;
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = / {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        add_header Cache-Control "public, max-age=60" always;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control Expires;

        proxy_cache keflab_staging_home;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_bypass $args;
        proxy_no_cache $args;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_pass http://keflab_staging_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    location = /api/error {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        limit_req zone=keflab_error burst=10 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass http://keflab_staging_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        proxy_pass http://keflab_staging_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    location ^~ /go/ {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        limit_req zone=keflab_go burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/keflab-staging-go.access.log keflab_go;
        error_log /var/log/nginx/keflab-staging-go.error.log crit;
        proxy_pass http://keflab_staging_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    location ^~ /_nuxt/ {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(?!go/|api/|_nuxt/)[^.]*[^/]$ {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        return 301 https://staging.keflab.ru$keflab_slash_target;
    }

    location / {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/index.html @node;
    }

    location @node {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        proxy_pass http://keflab_staging_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    # Виджет (шаг 12) на staging. Basic auth наследуется из server и остаётся: виджет на staging
    # снаружи не встраивают. Браузеры обычно не показывают запрос пароля в сторонней iframe, так что
    # чужая страница его просто не загрузит. Заголовки — как у production, чтобы staging проверял то же.
    location = /embed/sistema {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        return 301 https://staging.keflab.ru$keflab_slash_target;
    }

    location ^~ /embed/ {
        include /etc/nginx/keflab/snippets/security-headers-embed.conf;
        include /etc/nginx/keflab/snippets/staging-noindex.conf;
        add_header Cache-Control "public, max-age=60" always;

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header X-Frame-Options;
        proxy_ignore_headers Cache-Control Expires;

        access_log /var/log/nginx/keflab-staging.access.log keflab_main;

        proxy_cache keflab_staging_embed;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_bypass $keflab_embed_nocache;
        proxy_no_cache $keflab_embed_nocache;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_pass http://keflab_staging_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }
}
