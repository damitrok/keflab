# keflab.ru — продакшн.
# Статика: /srv/keflab/current/.output/public (симлинк на текущий релиз).
# Node (SSR главной, /api/*, /go/*): 127.0.0.1:3000 через upstream keflab_node (conf.d/keflab-http.conf).
# Страна клиента (GeoIP) уходит в Node только через proxy-node.conf: заголовок X-Keflab-Country
# задаёт Nginx в каждом location с proxy_pass. Установка GeoIP — README, раздел «GeoIP».
# Установка в /etc/nginx/sites-available/keflab.ru; сниппеты — в /etc/nginx/keflab/snippets/.
# ВНИМАНИЕ: nginx локально не проверялся. Перед включением: sudo nginx -t.

# --- HTTP: ACME для Let's Encrypt и перенаправление на HTTPS ---
server {
    listen 80;
    listen [::]:80 ;
    server_name keflab.ru www.keflab.ru;
    access_log /var/log/nginx/keflab.access.log keflab_main;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # Сырой $request_uri: декодированный $uri здесь опасен (CRLF в Location).
    location / {
        return 301 https://keflab.ru$request_uri;
    }
}

# --- www: HTTPS, HSTS и заголовки, 301 на keflab.ru ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.keflab.ru;

    ssl_certificate     /etc/letsencrypt/live/keflab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keflab.ru/privkey.pem;
    include /etc/nginx/keflab/snippets/ssl.conf;

    access_log /var/log/nginx/keflab.access.log keflab_main;

    location / {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        return 301 https://keflab.ru$request_uri;
    }
}

# --- Основной сайт: HTTPS, HTTP/2 ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keflab.ru;

    ssl_certificate     /etc/letsencrypt/live/keflab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keflab.ru/privkey.pem;
    include /etc/nginx/keflab/snippets/ssl.conf;

    # Задаёт $keflab_script_hashes для script-src. Файл пишет root-утилита, не deploy.
    include /etc/nginx/keflab/csp/production.conf;

    root /srv/keflab/current/.output/public;
    client_max_body_size 16k;

    access_log /var/log/nginx/keflab.access.log keflab_main;
    error_log /var/log/nginx/keflab.error.log warn;

    include /etc/nginx/keflab/snippets/compression.conf;
    # include /etc/nginx/keflab/snippets/brotli.conf;   # только после установки ngx_brotli, см. файл

    # Главная — ВСЕГДА из Node (SSR, параметры расчёта, шаг 4). Предсобранного файла для / нет.
    # Кэш — только без query-строки. С параметрами: не читать кэш и не класть в кэш.
    # Если Node не отвечает, отдаём последнюю закэшированную главную без параметров.
    location = / {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=60" always;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control Expires;

        proxy_cache keflab_home;
        # Кэш разделён по стране: если главная зависит от страны (офферы), чужой ответ не уйдёт другому.
        proxy_cache_key "$scheme$proxy_host$request_uri|$keflab_geo_country";
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_bypass $args;
        proxy_no_cache $args;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_pass http://keflab_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    # Заявки об ошибках из браузера: POST, 1 запрос в секунду на сеть (/24, /64), всплеск 10.
    location = /api/error {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        limit_req zone=keflab_error burst=10 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_pass http://keflab_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    # Счётчики показов (шаг 12): только POST, тело до 1 КБ, лимит 5 запросов/с на сеть (всплеск 20).
    # Лимит считается по сети (IPv4 /24, IPv6 /64, см. keflab-http.conf) и хранится в памяти. Лог — как у /go: без IP и User-Agent.
    # Node не должен записывать адрес из X-Real-IP / X-Forwarded-For (передаётся proxy-node.conf).
    location = /api/stat {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        limit_req zone=keflab_stat burst=20 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 1k;

        access_log /var/log/nginx/keflab-stat.access.log keflab_go;
        error_log /var/log/nginx/keflab-stat.error.log crit;

        proxy_pass http://keflab_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    # API (в т.ч. /api/geo, /api/health) — всегда Node, без кэша.
    location ^~ /api/ {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        proxy_pass http://keflab_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    # Переходы на офферы (шаг 13): без индексации, лимит на сеть (/24, /64), лог без IP.
    # error_log crit: отказы limit_req и ошибки upstream (записи с адресом клиента) сюда не пишутся.
    location ^~ /go/ {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;

        # 302 на оффер не кэшируем ни в Nginx, ни в браузере: гео, срок и выключатель проверяются на каждом переходе.
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        limit_req zone=keflab_go burst=20 nodelay;
        limit_req_status 429;

        access_log /var/log/nginx/keflab-go.access.log keflab_go;
        error_log /var/log/nginx/keflab-go.error.log crit;

        proxy_pass http://keflab_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    # Хэшированные файлы сборки: навсегда.
    location ^~ /_nuxt/ {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Адреса без завершающего слеша -> с ним. Сырой $request_uri (см. map в keflab-http.conf).
    # Исключения (?!go/|api/|_nuxt/): /go/<id> без слеша в конце не редиректится; /api/ и /_nuxt/ — тоже.
    location ~ ^/(?!go/|api/|_nuxt/)[^.]*[^/]$ {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        return 301 https://keflab.ru$keflab_slash_target;
    }

    # Предсобранные страницы и служебные файлы (robots.txt, sitemap.xml, favicon).
    # Короткий кэш: после выпуска страницы обновляются за 5 минут.
    location / {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/index.html @node;
    }

    # Всё, чего нет в статике (404, неизвестные адреса), — в Node: там app/error.vue.
    location @node {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        proxy_pass http://keflab_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }

    # Виджет (шаг 12): адрес без слеша -> со слешем. Точное совпадение бьёт ^~ /embed/ ниже.
    location = /embed/sistema {
        include /etc/nginx/keflab/snippets/security-headers.conf;
        return 301 https://keflab.ru$keflab_slash_target;
    }

    # --- Виджет /embed/ (шаг 12): единственное место, где сайт можно встроить в чужую страницу ---
    # Заголовки — свой набор (frame-ancestors *), вместо security-headers.conf, не вместе с ним.
    # Node шлёт свои CSP и X-Robots-Tag (nuxt.config routeRules) — Nginx их прячет и ставит свои.
    # Кэш: только пустой query и theme=light|dark (map $keflab_embed_nocache в keflab-http.conf).
    # При падении Node отдаём последнюю закэшированную копию (use_stale).
    location ^~ /embed/ {
        include /etc/nginx/keflab/snippets/security-headers-embed.conf;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=60" always;

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header X-Frame-Options;
        proxy_ignore_headers Cache-Control Expires;

        access_log /var/log/nginx/keflab.access.log keflab_main;

        proxy_cache keflab_embed;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_bypass $keflab_embed_nocache;
        proxy_no_cache $keflab_embed_nocache;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_pass http://keflab_node;
        include /etc/nginx/keflab/snippets/proxy-node.conf;
    }
}
