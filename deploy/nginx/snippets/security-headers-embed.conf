# Заголовки безопасности для /embed/ (виджет, шаг 12). Подключать ТОЛЬКО в location ^~ /embed/
# вместо security-headers.conf (не вместе с ним: иначе два CSP-заголовка).
#
# Отличия от основного набора:
#   - frame-ancestors * — виджет встраивают чужие сайты. Это единственное место конфигов,
#     где есть frame-ancestors * (проверяет check-deploy.mjs).
#   - нет X-Frame-Options: браузер применил бы и его, и встраивание было бы запрещено.
#   - Метрики нет ни в одной директиве: виджет её не загружает. Счётчики показов — свой
#     endpoint /api/stat (same-origin, без cookie), поэтому connect-src только 'self'.
#   - frame-src 'none': виджет сам ничего не встраивает.
#   - X-Robots-Tag не здесь: у production он задан в location, у staging — staging-noindex.conf.
#
# $keflab_script_hashes — тот же набор, что у сайта (один билд Nuxt). Состав набора
# проверяется на релизе: см. README, «Виджет /embed/».

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# style-src 'unsafe-inline': то же TODO, что и у сайта (inline-стили Nuxt).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $keflab_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *" always;
