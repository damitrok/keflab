# Brotli — НЕ подключён по умолчанию. Включать только если установлен модуль ngx_brotli.
#
# Как подключить (Ubuntu 24.04):
#   1. Установить модуль. Имена пакетов проверить: apt search brotli | grep nginx
#      (обычно libnginx-mod-http-brotli-filter и libnginx-mod-http-brotli-static).
#   2. В начало /etc/nginx/nginx.conf (до блока events) добавить:
#        load_module modules/ngx_http_brotli_filter_module.so;
#        load_module modules/ngx_http_brotli_static_module.so;
#      (пути — как в /etc/nginx/modules-enabled/, пакет обычно сам подключает модуль).
#   3. В server-блоки keflab.ru и staging добавить строку:
#        include /etc/nginx/keflab/snippets/brotli.conf;
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# Без модуля nginx -t упадёт на директиве brotli. Поэтому файл не входит в
# keflab.ru.conf по умолчанию.

brotli on;
brotli_comp_level 5;
brotli_static on;
brotli_types text/css application/javascript application/json application/xml text/xml image/svg+xml text/plain;
