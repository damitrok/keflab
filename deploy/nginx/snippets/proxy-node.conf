# Проксирование в Node (127.0.0.1). Подключать после proxy_pass в location.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# Адрес клиента — только непосредственный адрес соединения, без цепочки, которую может прислать клиент.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Короткий connect: когда Node упал, Nginx быстро отвечает 502 и отдаёт кэш главной.
proxy_connect_timeout 2s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Заголовки безопасности задаёт Nginx (snippets/security-headers.conf), не приложение.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
