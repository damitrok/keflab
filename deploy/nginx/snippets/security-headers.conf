# Заголовки безопасности. Подключать В КАЖДОМ location (и в @node тоже).
# add_header не наследуется: если в location есть свой add_header, родительские
# перестают действовать. Поэтому набор не вынесен на уровень server.
# always — заголовки есть и у ответов 404/5xx.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# script-src: 'self' + Метрика + хэши inline-скриптов ($keflab_script_hashes задаёт
#   /etc/nginx/keflab/csp/<env>.conf, его пишет /usr/local/sbin/keflab-install-csp).
# style-src 'unsafe-inline': TODO — Nuxt выводит inline <style> на каждой странице
#   (их ~19 на главной) и style="" в SSR; хэши стилей пока не делаем.
# frame-src: счётчик Яндекс Метрики (рекомендация Яндекса). Проверить в браузере после включения счётчика.
# frame-ancestors 'none': для /embed/ (шаг 12) свой набор, см. закомментированный location в keflab.ru.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru $keflab_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
