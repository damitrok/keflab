# Сжатие gzip (включено обязательно). Подключать в server-блок.
# text/html сжимается всегда (встроенное поведение nginx), в список его не пишем.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml text/plain;

# Предсжатые файлы из .output/public (.gz, создаёт Nitro): отдаём без пережатия.
# Нужен модуль ngx_http_gzip_static_module (в пакетах Ubuntu он есть).
gzip_static on;
